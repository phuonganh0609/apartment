<div class="pagination"><span>{{ page_obj.paginator.count }} kết quả · Trang {{ page_obj.number }}/{{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="btn btn-secondary" href="?{{ query_string }}&amp;page={{ page_obj.previous_page_number }}{% if month %}&amp;month={{ month }}{% endif %}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">← Trước</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-secondary" href="?{{ query_string }}&amp;page={{ page_obj.next_page_number }}{% if month %}&amp;month={{ month }}{% endif %}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Sau →</a>{% endif %}</div></div>
