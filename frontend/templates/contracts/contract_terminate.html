{% extends 'base.html' %}{% block content %}<section class="panel card border-0 shadow-sm form-panel"><h2>Thanh lý {{ object.code }}</h2><p>Hợp đồng sẽ chuyển sang đã thanh lý. Tiền cọc và các khoản thanh toán được giữ để đối soát; thao tác này không tự hoàn cọc hoặc xóa công nợ.</p>{% if error %}<div class="notice alert alert-danger error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="form-actions d-flex flex-wrap justify-content-end gap-2 border-top pt-4 mt-4"><a class="btn btn-secondary btn-outline-secondary" href="{% url 'contracts:contract_detail' object.pk %}">Quay lại</a><button class="btn btn-danger" type="submit">Xác nhận thanh lý</button></div></form></section>{% endblock %}
