{% extends 'generic/detail.html' %}{% load ai_access %}{% block related_content %}<section class="panel card border-0 shadow-sm detail-panel">{% ai_action user object.contract_id "payment" as show_ai_action %}{% if show_ai_action %}<a class="btn btn-primary" href="{% url 'ai_assistant:notification' object.contract_id %}?payment={{ object.pk }}">✧ Soạn thông báo thanh toán</a>{% endif %}{% if object.is_overdue %}<p class="error-text text-danger">Khoản thu đã quá hạn thanh toán.</p>{% endif %}</section>{% endblock %}
