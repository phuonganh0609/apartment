{% extends 'generic/detail.html' %}{% block related_content %}<section class="panel detail-panel"><h2>Người liên hệ</h2>{% for contact in contacts %}<div class="activity-row"><a href="{% url 'tenants:contact_detail' contact.pk %}">{{ contact.full_name }}</a><span>{{ contact.relationship }}</span><span>{{ contact.phone }}</span></div>{% empty %}<p>Chưa có người liên hệ.</p>{% endfor %}{% if can_write %}<a class="btn btn-secondary" href="{% url 'tenants:contact_create' %}">Thêm người liên hệ</a>{% endif %}</section>{% endblock %}
